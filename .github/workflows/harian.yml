name: Analisa harian

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: analisa-harian
  cancel-in-progress: false

jobs:
  analisa:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pasang library
        run: pip install yfinance pandas numpy plotly
      - name: Jalankan analisa
        run: python analisa.py
      - name: Catat rekam jejak
        if: always()
        run: python rekam.py
      - name: Cari pola jam-jaman
        if: always()
        run: python pola.py
      - name: Simpan hasil
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update harian"
          git pull --rebase origin main
          git push
